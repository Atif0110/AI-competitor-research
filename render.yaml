services:
  - type: web
    name: ai-competitor-research-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///data/competitor.db
      - key: LLM_PROVIDER
        value: auto
      - key: API_KEY_REQUIRED
        value: "true"
