# Render blueprint: API (Docker) + static frontend, both on the free plan.
#
# The API needs the new deep-research and chat environment variables to be
# useful; without keys it still runs in evidence-only mode.
services:
  - type: web
    name: ai-competitor-research-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///data/competitor.db
      - key: VECTOR_STORE_DIR
        value: data/vectors
      - key: CHECKPOINT_DIR
        value: data/checkpoints
      - key: REPORT_OUTPUT_DIR
        value: data/reports
      - key: LLM_PROVIDER
        value: auto
      - key: API_KEY_REQUIRED
        value: "true"
      - key: API_KEY
        sync: false
      # Free-first provider chain: Gemini primary, Groq fallback.
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Deep research engine
      - key: DEEP_LLM_ENABLED
        value: "true"
      - key: DEEP_SEARCH_ENABLED
        value: "true"
      - key: DEEP_MAX_PAGES
        value: "12"
      - key: DEEP_MAX_DEPTH
        value: "2"
      - key: CHAT_TOP_K
        value: "6"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ai-competitor-research-web
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://p01--ai-research-platform--tqfz8cfnnfsv.code.run
