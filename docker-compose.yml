services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: competitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d competitor"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      args:
        WITH_PLAYWRIGHT: "false"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/competitor
      API_KEY_REQUIRED: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
